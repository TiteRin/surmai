name: Tests
on:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Run unit tests
      run: pnpm test --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=test-reports/unit-junit.xml
    - name: Publish unit test report
      if: ${{ !cancelled() }}
      uses: dorny/test-reporter@v2
      with:
        name: Unit test report
        path: test-reports/unit-junit.xml
        reporter: java-junit

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Install Playwright browsers
      run: pnpm exec playwright install --with-deps chromium firefox
    # Playwright starts the backend with `go run`, compile it beforehand so it starts within the timeout
    - name: Build backend
      working-directory: backend
      run: go build -o /dev/null .
    - name: Run e2e tests
      run: pnpm test:e2e
    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
    - name: Publish e2e test report
      if: ${{ !cancelled() }}
      uses: dorny/test-reporter@v2
      with:
        name: E2E test report
        path: test-reports/e2e-junit.xml
        reporter: java-junit
